name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-lint-and-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Verify formatting
        run: |
          cd mobile
          dart format --output=none --set-exit-if-changed . || {
            echo "::warning::Formatting differences detected across Dart SDK versions"
          }

      - name: Analyze Dart code
        run: |
          cd mobile
          flutter analyze
